# Named "CI" on purpose: claude-dispatcher's own deploy detection treats
# workflows named deploy/release/publish/ship/prod as a live signal, and this
# repo's checks must never read as a deploy.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: stable
      - run: go build ./...
      - run: go test ./... -race -count=1 -coverprofile=coverage.out
      - name: Convert coverage to Cobertura XML
        run: go run github.com/boumenot/gocover-cobertura@v1.2.0 < coverage.out > coverage.xml
      - name: Upload coverage artifact
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report-go
          path: coverage.xml

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: stable
      - name: gofmt
        run: test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }
      - uses: golangci/golangci-lint-action@v8
        with:
          version: latest

  # Native Windows build gate. Runtime behaviour of the Windows session backend
  # still needs validation on a real machine; this keeps the tree compiling and
  # vetting for windows so the port can't silently regress. (Tests are not run
  # here yet — several sandbox their config via $HOME, which os.UserHomeDir does
  # not honour on Windows; that is a separate cross-platform-tests task.)
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: stable
      - run: go build ./...
      - run: go vet ./...
      - run: go test ./internal/supervisor/... -count=1

  upload-coverage-go:
    needs: test
    if: ${{ !cancelled() && needs.test.result == 'success' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      code-quality: write
    steps:
      - name: Download coverage artifact
        uses: actions/download-artifact@v4.1.3
        with:
          name: coverage-report-go
      - uses: actions/upload-code-coverage@v1
        with:
          file: coverage.xml
          language: Go
          label: code-coverage-agent
