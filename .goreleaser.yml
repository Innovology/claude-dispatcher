version: 2

project_name: claude-dispatcher

before:
  hooks:
    - go mod tidy

builds:
  - env:
      - CGO_ENABLED=0
    goos: [darwin, linux, windows]
    goarch: [amd64, arm64]
    # -trimpath keeps builder filesystem paths (home dir, module cache) out
    # of the shipped binaries.
    flags:
      - -trimpath
    ldflags:
      - -s -w -X claude-dispatcher/internal/version.Version={{.Version}}

archives:
  # Unix stays tar.gz; Windows ships a .zip (native tooling and the
  # scoop/winget publishers below both expect zip archives).
  - formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]

checksum:
  name_template: checksums.txt

changelog:
  use: github

homebrew_casks:
  - repository:
      owner: Innovology
      name: homebrew-tap
      token: "{{ .Env.HOMEBREW_TAP_TOKEN }}"
    homepage: https://github.com/Innovology/claude-dispatcher
    description: Terminal dispatch cockpit for Claude Code sessions across many repositories
    dependencies:
      - formula: tmux
    caveats: |
      Requires the claude CLI (Claude Code) on your PATH.
      Run `claude-dispatcher init` to configure repo roots and install the
      status hook.
    # Unsigned binary: clear the quarantine attribute so Gatekeeper does not
    # block first run.
    #
    # The guard is `OS.mac?` — a Ruby question, answered without running
    # anything — and not a probe for xattr itself, because the cask ships the
    # Linux build too (goreleaser emits an `on_linux` block, and Homebrew
    # installs casks on Linux), so this postflight also runs on Linuxbrew,
    # which is how the README tells a Windows user to install under WSL2.
    # There, /usr/bin/xattr does not exist; a cask's `system_command` is
    # SystemCommand.run! (must_succeed), so the missing binary comes back as
    # exit 127 and raises — the probe that was meant to be the guard was
    # itself what failed the install, and every WSL install died in
    # postflight. must_succeed: false keeps the same promise on macOS: a
    # quarantine we could not strip is a first-run warning, never a failed
    # install.
    hooks:
      post:
        install: |
          if OS.mac?
            system_command "/usr/bin/xattr", args: ["-dr", "com.apple.quarantine", "#{staged_path}/claude-dispatcher"], must_succeed: false
          end

# Windows native package managers. Both mirror the Homebrew tap pattern: a
# separate publish repo reached with its own fine-grained PAT. The skip_upload
# template makes each a pure no-op when its token is unset, so a release that
# only has HOMEBREW_TAP_TOKEN (the current v1 pipeline) still succeeds — the
# manifest is generated but never pushed.
scoops:
  - repository:
      owner: Innovology
      name: scoop-bucket
      token: "{{ .Env.SCOOP_BUCKET_TOKEN }}"
    homepage: https://github.com/Innovology/claude-dispatcher
    description: Terminal dispatch cockpit for Claude Code sessions across many repositories
    license: MIT
    # No-op unless SCOOP_BUCKET_TOKEN is set, so a token-less run never fails.
    skip_upload: '{{ if .Env.SCOOP_BUCKET_TOKEN }}false{{ else }}true{{ end }}'

winget:
  - name: claude-dispatcher
    publisher: Innovology
    package_identifier: Innovology.claude-dispatcher
    short_description: Terminal dispatch cockpit for Claude Code sessions across many repositories
    homepage: https://github.com/Innovology/claude-dispatcher
    license: MIT
    repository:
      # A fork of microsoft/winget-pkgs the user owns; goreleaser opens the
      # PR against it. Kept as branch commits so nothing publishes until a
      # WINGET_TOKEN is present.
      owner: Innovology
      name: winget-pkgs
      token: "{{ .Env.WINGET_TOKEN }}"
      branch: "claude-dispatcher-{{ .Version }}"
    # No-op unless WINGET_TOKEN is set, so a token-less run never fails.
    skip_upload: '{{ if .Env.WINGET_TOKEN }}false{{ else }}true{{ end }}'
